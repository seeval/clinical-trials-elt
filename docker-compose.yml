services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical_postgres_dw
    environment:
    - POSTGRES_DB=clinical_dw
    - POSTGRES_USER=analytics_user
    - POSTGRES_PASSWORD=analytics_password
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d clinical_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
