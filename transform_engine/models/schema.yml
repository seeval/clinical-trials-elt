version: 2

models:
  - name: fct_clinical_trials
    description: "Core fact table for clinical studies at the nct_id grain."
    columns:
      - name: nct_id
        tests:
          - unique
          - not_null
      - name: overall_status
        tests:
          - not_null

  - name: int_clinical_conditions
    description: "Normalized child table unnesting study conditions."
    columns:
      - name: nct_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_clinical_trials')
                field: nct_id
      - name: condition_name
        tests:
          - not_null
