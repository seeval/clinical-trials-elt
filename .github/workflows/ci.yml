name: CI Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & dependencies
        run: |
          pip install uv
          uv sync
      
      - name: Create Dummy dbt profiles.yml for CI Parse Check
        run: |
          mkdir -p transform_engine
          cat << EOF > transform_engine/profiles.yml
          clinical_trials_transform:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: output/test_dw.duckdb
          EOF

      - name: Run dbt Parse Check
        run: |
          uv run dbt parse --project-dir transform_engine --profiles-dir transform_engine
